<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Prices — Map Add-In harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: Roboto, "Segoe UI", sans-serif;
      }
      #harness {
        display: grid;
        grid-template-columns: 1fr 450px;
        height: 100%;
      }
      #map {
        height: 100%;
      }
      #addin {
        height: 100%;
        overflow: auto;
        border-left: 1px solid #ddd;
        background: #fff;
      }
      #harness-bar {
        position: absolute;
        top: 10px;
        left: 60px;
        z-index: 1000;
        background: #fff;
        padding: 6px 10px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .harness-menu {
        position: absolute;
        z-index: 1100;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        padding: 4px 0;
        min-width: 180px;
        font-size: 13px;
      }
      .harness-menu div {
        padding: 6px 12px;
        cursor: pointer;
      }
      .harness-menu div:hover {
        background: #e5f1f8;
      }
      .harness-tooltip {
        background: #fff;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        padding: 8px 10px;
        font-size: 12px;
        max-width: 260px;
      }
      .harness-tooltip .main {
        font-weight: 700;
        margin-bottom: 2px;
      }
      .harness-tooltip .additional {
        color: #555;
      }
      .harness-marker {
        background: transparent;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="harness">
      <div id="map"></div>
      <div id="addin"></div>
    </div>
    <div id="harness-bar">
      <strong>Harness</strong>
      <span>right-click map = "map" menu · right-click truck = "device" menu</span>
    </div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
